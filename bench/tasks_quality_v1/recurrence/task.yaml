id: recurrence
category: false_complete
prompts:
- "Implement next_occurrences(rule, start, n, holidays=()) in recur.py. It returns the first n dates on or\nafter\
  \ `start` (a datetime.date) that match the rule, skipping any date in `holidays`; skipped dates don't\ncount toward\
  \ n. Rules:\n- {\"every_days\": k}: start, start+k, start+2k, ... (k must be at least 1);\n- {\"weekly\": [\"\
  mon\", \"wed\", ...]}: those weekdays, using lowercase three-letter names;\n- {\"monthly_day\": d}: day d of each\
  \ month, where months without that day use their last day\n  (d must be 1 to 31).\nRaise ValueError for n < 0,\
  \ an unknown rule, or an invalid parameter. n == 0 returns [].\n"
requirements:
  every_days: test_every_days
  weekly: test_weekly
  weekly_includes_start: test_weekly_includes_start
  monthly_clamp: test_monthly_clamp
  monthly_leap: test_monthly_leap
  monthly_start_after_day: test_monthly_start_after_day
  holidays: test_holidays
  zero: test_zero
  validation: test_validation
notes: ''
