id: rr_ordinal_words
category: multi_turn
prompts:
- 'Add a `words=False` option to SymPy''s `ordinal` helper: with words=True, 1 through 12 are spelled out (''first'',
  ''second'', ..., ''twelfth''); other numbers keep the numeric form (''13th'').'
- With words=True, negative numbers get 'minus ' in front ('minus third'), and zero is 'zeroth'.
- Put the word table in a module-level dict called ORDINAL_WORDS (int -> word) so other code can reuse it, and extend
  it through 20 ('twentieth').
