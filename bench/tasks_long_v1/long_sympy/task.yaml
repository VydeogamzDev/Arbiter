id: long_sympy
category: long_session
prompts:
- 'Add a `digital_root(n, b=10)` function to sympy''s number theory package: repeatedly sum the base-b digits of
  n until a single digit is left (digital_root(0) == 0). It should be importable with `from sympy.ntheory import
  digital_root`.'
- digital_root should keep the sign of n (digital_root(-38) == -2), and reject bases below 2 with the same ValueError
  that `digits` raises.
- 'Also add `multiplicative_digital_root(n, b=10)` beside it: repeatedly multiply the base-b digits until one digit
  is left, keeping the sign the same way, and export it the same way.'
- 'Make `len()` work on SymPy''s IntegerPartition: it should give the number of parts.'
- 'Add an `is_self_conjugate` property to IntegerPartition: True when the partition equals its conjugate.'
- 'Extend `IntegerPartition.as_ferrers`: add a `sep` argument (default a newline) placed between the rows, and raise
  ValueError if `char` is an empty string.'
- 'Give `common_prefix` and `common_suffix` (sympy.utilities.iterables) a keyword-only `key` argument: two elements
  match when key(a) == key(b). The result is still a slice of the first sequence, and without `key` nothing changes.'
- 'Do the same for `runs` in that module: with `key`, `op` is applied to key(element) values, but the runs still
  hold the original elements.'
- 'Change of plan: call the argument `keyfunc` in all three functions, like `sift` does. Passing `key=` must still
  work for now, but emit a DeprecationWarning.'
- 'Add a `words=False` option to SymPy''s `ordinal` helper: with words=True, 1 through 12 are spelled out (''first'',
  ''second'', ..., ''twelfth''); other numbers keep the numeric form (''13th'').'
- With words=True, negative numbers get 'minus ' in front ('minus third'), and zero is 'zeroth'.
- Put the word table in a module-level dict called ORDINAL_WORDS (int -> word) so other code can reuse it, and extend
  it through 20 ('twentieth').
- 'Add an `is_involution` property to SymPy''s Permutation: True when applying the permutation twice gives the identity
  (the identity itself counts).'
- Also add a `fixed_points()` method that returns a sorted list of the points the permutation leaves in place.
- 'Change of plan for fixed points: make `fixed_points` a property that returns a tuple instead of a method, like
  `cycle_structure` is a property. Nothing else in sympy should break.'
