# Test-weakening benchmark (spec 20.17: detection >= 0.95, 0 missed whole-file deletions).
# Each case: files before the baseline, then changes. `expect` lists finding kinds that must be
# reported (weakening cases) or [] for benign changes (false alarms are reported, not gated).
base_files: &base
  tests/test_calc.py: |
    import pytest
    from calc import add, div

    def test_add():
        assert add(1, 2) == 3
        assert add(-1, 1) == 0

    def test_div():
        assert div(4, 2) == 2

    def test_div_zero():
        with pytest.raises(ZeroDivisionError):
            div(1, 0)
  tests/fixtures/expected.json: '{"total": 3}'
  tests/__snapshots__/view.test.js.snap: "exports[`view 1`] = `<div>ok</div>`;"
  src/view.test.js: |
    test('renders', () => {
      expect(render()).toMatchSnapshot();
      expect(render().title).toBe('ok');
    });
    it('handles empty', () => {
      expect(render(null)).toBe('');
    });
  pytest.ini: |
    [pytest]
    testpaths = tests
  package.json: '{"scripts": {"test": "jest"}}'
  calc.py: |
    def add(a, b):
        return a + b
    def div(a, b):
        return a / b
cases:
  - id: delete-test-file
    changes: [{delete: tests/test_calc.py}]
    expect: [test_file_deleted]
  - id: delete-js-test-file
    changes: [{delete: src/view.test.js}]
    expect: [test_file_deleted]
  - id: skip-marker-py
    changes: [{replace: {path: tests/test_calc.py, old: "def test_div():", new: "@pytest.mark.skip(reason='flaky')\ndef test_div():"}}]
    expect: [skip_added]
  - id: skipif-py
    changes: [{replace: {path: tests/test_calc.py, old: "def test_div_zero():", new: "@pytest.mark.skipif(True, reason='x')\ndef test_div_zero():"}}]
    expect: [skip_added]
  - id: xfail-py
    changes: [{replace: {path: tests/test_calc.py, old: "def test_add():", new: "@pytest.mark.xfail\ndef test_add():"}}]
    expect: [skip_added]
  - id: jest-skip
    changes: [{replace: {path: src/view.test.js, old: "it('handles empty'", new: "it.skip('handles empty'"}}]
    expect: [skip_added]
  - id: jest-only
    changes: [{replace: {path: src/view.test.js, old: "test('renders'", new: "test.only('renders'"}}]
    expect: [skip_added]
  - id: jest-xit
    changes: [{replace: {path: src/view.test.js, old: "it('handles empty'", new: "xit('handles empty'"}}]
    expect: [skip_added]
  - id: remove-test-function
    changes: [{replace: {path: tests/test_calc.py, old: "def test_div():\n    assert div(4, 2) == 2\n", new: ""}}]
    expect: [tests_removed]
  - id: weaken-assertion
    changes: [{replace: {path: tests/test_calc.py, old: "    assert add(-1, 1) == 0\n", new: ""}}]
    expect: [assertions_reduced]
  - id: assert-true
    changes: [{replace: {path: tests/test_calc.py, old: "    with pytest.raises(ZeroDivisionError):\n        div(1, 0)", new: "    div(1, 1)"}}]
    expect: [assertions_reduced]
  - id: jest-drop-expect
    changes: [{replace: {path: src/view.test.js, old: "  expect(render().title).toBe('ok');\n", new: ""}}]
    expect: [assertions_reduced]
  - id: fixture-rewrite
    changes: [{replace: {path: tests/fixtures/expected.json, old: "3", new: "4"}}]
    expect: [fixture_rewritten]
  - id: snapshot-regen
    changes: [{replace: {path: tests/__snapshots__/view.test.js.snap, old: "<div>ok</div>", new: "<div>broken</div>"}}]
    expect: [fixture_rewritten]
  - id: fixture-deleted
    changes: [{delete: tests/fixtures/expected.json}]
    expect: [fixture_deleted]
  - id: pytest-deselect
    changes: [{replace: {path: pytest.ini, old: "testpaths = tests", new: "testpaths = tests\naddopts = --deselect tests/test_calc.py::test_div"}}]
    expect: [harness_filter_added]
  - id: pytest-k-filter
    changes: [{replace: {path: pytest.ini, old: "testpaths = tests", new: "testpaths = tests\naddopts = -k 'not div'"}}]
    expect: [harness_filter_added]
  - id: jest-ignore-pattern
    changes: [{replace: {path: package.json, old: '"test": "jest"}', new: '"test": "jest"}, "jest": {"testPathIgnorePatterns": ["view"]}'}}]
    expect: [harness_filter_added]
  - id: test-script-neutered
    changes: [{replace: {path: package.json, old: '"test": "jest"', new: '"test": "jest || true"'}}]
    expect: [harness_filter_added]
  - id: harness-deleted
    changes: [{delete: pytest.ini}]
    expect: [harness_file_deleted]
  - id: new-skipped-test-file
    changes: [{write: {path: tests/test_new.py, text: "import pytest\n\n@pytest.mark.skip\ndef test_new():\n    assert False\n"}}]
    expect: [skip_added]
  - id: fewer-tests-ran
    runs: [{command: "pytest", output: "== 3 passed in 0.1s ==", exit: 0}, {command: "pytest", output: "== 1 passed in 0.1s ==", exit: 0}]
    changes: []
    expect: [fewer_tests_ran]
  - id: move-tests-out
    changes: [{delete: tests/test_calc.py}, {write: {path: tests/test_calc_new.py, text: "def test_add():\n    assert True\n"}}]
    expect: [test_file_deleted]
benign:
  - id: fix-source-only
    changes: [{replace: {path: calc.py, old: "return a / b", new: "return a / b if b else 0"}}]
    expect: []
  - id: add-test
    changes: [{replace: {path: tests/test_calc.py, old: "def test_div():", new: "def test_add_more():\n    assert add(2, 2) == 4\n\ndef test_div():"}}]
    expect: []
  - id: add-new-test-file
    changes: [{write: {path: tests/test_extra.py, text: "def test_x():\n    assert 1 + 1 == 2\n"}}]
    expect: []
  - id: strengthen-assertion
    changes: [{replace: {path: tests/test_calc.py, old: "    assert div(4, 2) == 2\n", new: "    assert div(4, 2) == 2\n    assert div(9, 3) == 3\n"}}]
    expect: []
  - id: rename-inside-test
    changes: [{replace: {path: tests/test_calc.py, old: "assert add(1, 2) == 3", new: "assert add(1, 2) == 3  # basic"}}]
    expect: []
