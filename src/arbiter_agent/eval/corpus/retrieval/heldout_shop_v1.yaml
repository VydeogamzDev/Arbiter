# Held-out retrieval queries, v1 (2026-09-25), on the "shop" fixture, written after retrieval was
# developed on queries.yaml. FROZEN: never tune retrieval against it.
version: 1
repo: shop
queries:
  - {id: s01, query: "users can log in with any email casing", gold: [shop/users/auth.py]}
  - {id: s02, query: "orders are saved before the payment succeeds", gold: [shop/checkout/checkout.py]}
  - {id: s03, query: "sqlite connection is never closed", gold: [shop/db/session.py]}
  - {id: s04, query: "refunds don't give the money back to the card", gold: [shop/payments/refunds.py, shop/payments/gateway.py]}
  - {id: s05, query: "rounding errors in the subtotal", gold: [shop/pricing/totals.py, shop/pricing/discounts.py]}
  - {id: s06, query: "the webhook secret is hard-coded", gold: [shop/payments/gateway.py]}
  - {id: s07, query: "search endpoint returns only SKUs", gold: [shop/api/handlers.py, shop/catalog/products.py]}
  - {id: s08, query: "add a quantity limit per cart line", gold: [shop/cart/cart.py]}
