    gold: [shop/config.py, shop/app.py]
  - {id: s10, query: "profile updates don't check the email is unique", gold: [shop/users/profile.py]}
  - {id: s11, query: "logging configuration for outgoing mail", gold: [shop/notify/email.py]}
  - {id: s12, query: "inventory test doesn't use a session", gold: [tests/test_inventory.py, shop/catalog/inventory.py]}
