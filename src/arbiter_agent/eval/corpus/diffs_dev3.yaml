# Diff-risk development set 3: formerly held-out v2 (2026-09-25). RETIRED as held-out after its
# single run measured 7.5% dangerous misses (3/40: Go Sprintf SQL, cookie httponly=False, hard-coded key)
# and the rules were extended. Now a development set; the held-out set is heldout/diffs_v3.yaml.
