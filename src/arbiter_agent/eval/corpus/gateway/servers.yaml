    inputSchema:
      type: object
      properties: {}
      required: []
    annotations:
      readOnlyHint: true
  postgres:
  - name: query
    description: Run a read-only SQL query and return rows. Returns a structured result; errors include a message and the
      offending field.
    inputSchema:
      type: object
      properties:
        sql:
          type: string
          description: The SQL statement to run. Use bound values rather than string concatenation.
      required:
      - sql
    annotations:
      readOnlyHint: true
  - name: list_tables
    description: List tables in the database schema. Returns a structured result; errors include a message and the offending
      field.
    inputSchema:
      type: object
      properties:
        schema:
          type: string
          description: The schema to use for this operation.
      required: []
    annotations:
      readOnlyHint: true
  - name: describe_table
    description: Columns, types and indexes of a table. Returns a structured result; errors include a message and the offending
      field.
    inputSchema:
      type: object
      properties:
        table:
          type: string
          description: The table to use for this operation.
      required:
      - table
    annotations:
      readOnlyHint: true
  - name: execute
    description: Execute a SQL statement that modifies data or schema. Returns a structured result; errors include a message
