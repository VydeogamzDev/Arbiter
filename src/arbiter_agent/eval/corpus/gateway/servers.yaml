    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
      required:
      - owner
      - repo
    annotations:
      readOnlyHint: true
  filesystem:
  - name: read_file
    description: Read the complete contents of a file. Returns a structured result; errors include a message and the offending
      field.
    inputSchema:
      type: object
      properties:
        path:
          type: string
          description: Path to the file or directory, relative to the root the server exposes.
      required:
      - path
    annotations:
      readOnlyHint: true
  - name: read_multiple_files
    description: Read several files at once. Returns a structured result; errors include a message and the offending field.
    inputSchema:
      type: object
      properties:
        paths:
          type: array
          items:
            type: string
          description: Paths of the files to read, relative to the root the server exposes.
      required:
      - paths
    annotations:
      readOnlyHint: true
  - name: write_file
    description: Create or overwrite a file with new content. Returns a structured result; errors include a message and the
      offending field.
    inputSchema:
      type: object
      properties:
        path:
          type: string
          description: Path to the file or directory, relative to the root the server exposes.
        content:
          type: string
          description: The full new content to write, as UTF-8 text.
      required:
      - path
      - content
    annotations:
      readOnlyHint: false
      destructiveHint: true
  - name: edit_file
    description: Make line-based edits to a text file and return a diff. Returns a structured result; errors include a message
