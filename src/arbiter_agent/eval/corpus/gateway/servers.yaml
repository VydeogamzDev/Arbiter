    inputSchema:
      type: object
      properties: {}
      required: []
    annotations:
      readOnlyHint: true
  - name: evaluate_javascript
    description: Run JavaScript in the page and return the result. Returns a structured result; errors include a message and
      the offending field.
    inputSchema:
      type: object
      properties:
        script:
          type: string
          description: The script to use for this operation.
      required:
      - script
    annotations:
      readOnlyHint: false
  - name: get_console_logs
    description: Read the browser console log. Returns a structured result; errors include a message and the offending field.
    inputSchema:
      type: object
      properties: {}
      required: []
    annotations:
