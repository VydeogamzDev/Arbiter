# Reference MCP servers for the gateway benchmark (M10.3): realistic tool sets with MCP
# annotations, modeled on common public servers. Not adopted anywhere; used only to measure.
version: 1
servers:
  github:
  - name: search_repositories
    description: Search GitHub repositories by keyword, language or topic. Returns a structured result; errors include a message
      and the offending field.
    inputSchema:
      type: object
      properties:
        query:
          type: string
          description: Search text. Supports the service's search qualifiers and boolean operators.
        page:
          type: integer
          description: Page number of results to return, starting at 1.
      required:
      - query
    annotations:
      readOnlyHint: true
  - name: get_repository
    description: 'Get metadata for a repository: description, default branch, stars, license. Returns a structured result;
      errors include a message and the offending field.'
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
      required:
      - owner
      - repo
    annotations:
      readOnlyHint: true
  - name: list_issues
    description: List issues in a repository, filtered by state, labels or assignee. Returns a structured result; errors include
      a message and the offending field.
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
        state:
          type: string
          enum:
          - open
          - closed
          - all
          description: Filter by state. Omit to use the service default.
        labels:
          type: array
          items:
            type: string
          description: Label names to filter by or apply; all given labels must match.
      required:
      - owner
      - repo
    annotations:
      readOnlyHint: true
  - name: get_issue
    description: Get one issue with its body and comments. Returns a structured result; errors include a message and the offending
      field.
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
        issue_number:
          type: integer
          description: The number that identifies the issue or pull request in this repository.
      required:
      - owner
      - repo
      - issue_number
    annotations:
      readOnlyHint: true
  - name: create_issue
    description: Open a new issue in a repository. Returns a structured result; errors include a message and the offending
      field.
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
        title:
          type: string
          description: A short, descriptive title.
        body:
          type: string
          description: Markdown body text. Supports mentions, task lists and code blocks.
        labels:
          type: array
          items:
            type: string
          description: Label names to filter by or apply; all given labels must match.
      required:
      - owner
      - repo
      - title
    annotations:
      readOnlyHint: false
  - name: update_issue
    description: Edit an issue's title, body, state, labels or assignees. Returns a structured result; errors include a message
      and the offending field.
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
        issue_number:
          type: integer
          description: The number that identifies the issue or pull request in this repository.
        state:
          type: string
          description: Filter by state. Omit to use the service default.
        title:
          type: string
          description: A short, descriptive title.
      required:
      - owner
      - repo
      - issue_number
    annotations:
      readOnlyHint: false
  - name: add_issue_comment
    description: Add a comment to an issue or pull request. Returns a structured result; errors include a message and the
      offending field.
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
        issue_number:
          type: integer
          description: The number that identifies the issue or pull request in this repository.
        body:
          type: string
          description: Markdown body text. Supports mentions, task lists and code blocks.
      required:
      - owner
      - repo
      - issue_number
      - body
    annotations:
      readOnlyHint: false
  - name: list_pull_requests
    description: List pull requests in a repository. Returns a structured result; errors include a message and the offending
      field.
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
        state:
          type: string
          description: Filter by state. Omit to use the service default.
        base:
          type: string
          description: The base to use for this operation.
      required:
      - owner
      - repo
    annotations:
      readOnlyHint: true
  - name: get_pull_request
    description: Get a pull request with its description, status and mergeability. Returns a structured result; errors include
      a message and the offending field.
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
        pull_number:
          type: integer
          description: The number that identifies the pull request in this repository.
      required:
      - owner
      - repo
      - pull_number
    annotations:
      readOnlyHint: true
  - name: get_pull_request_diff
    description: Get the unified diff of a pull request. Returns a structured result; errors include a message and the offending
      field.
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
        pull_number:
          type: integer
          description: The number that identifies the pull request in this repository.
      required:
      - owner
      - repo
      - pull_number
    annotations:
      readOnlyHint: true
  - name: get_pull_request_reviews
    description: List reviews and review comments on a pull request. Returns a structured result; errors include a message
      and the offending field.
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
        pull_number:
          type: integer
          description: The number that identifies the pull request in this repository.
      required:
      - owner
      - repo
      - pull_number
    annotations:
      readOnlyHint: true
  - name: create_pull_request
    description: Open a pull request from a head branch into a base branch. Returns a structured result; errors include a
      message and the offending field.
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
        title:
          type: string
          description: A short, descriptive title.
        head:
          type: string
          description: The head to use for this operation.
        base:
          type: string
          description: The base to use for this operation.
        body:
          type: string
          description: Markdown body text. Supports mentions, task lists and code blocks.
      required:
      - owner
      - repo
      - title
      - head
      - base
    annotations:
      readOnlyHint: false
  - name: merge_pull_request
    description: Merge a pull request (merge, squash or rebase). Returns a structured result; errors include a message and
      the offending field.
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
        pull_number:
          type: integer
          description: The number that identifies the pull request in this repository.
        merge_method:
          type: string
          enum:
          - merge
          - squash
          - rebase
          description: The merge method to use for this operation.
      required:
      - owner
      - repo
      - pull_number
    annotations:
      readOnlyHint: false
      destructiveHint: true
  - name: create_pull_request_review
    description: 'Submit a review on a pull request: approve, request changes or comment. Returns a structured result; errors
      include a message and the offending field.'
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
        pull_number:
          type: integer
          description: The number that identifies the pull request in this repository.
        event:
          type: string
          description: The event to use for this operation.
        body:
          type: string
          description: Markdown body text. Supports mentions, task lists and code blocks.
      required:
      - owner
      - repo
      - pull_number
      - event
    annotations:
      readOnlyHint: false
  - name: list_commits
    description: List commits on a branch, optionally for one path. Returns a structured result; errors include a message
      and the offending field.
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
        sha:
          type: string
          description: The sha to use for this operation.
        path:
          type: string
          description: Path to the file or directory, relative to the root the server exposes.
      required:
      - owner
      - repo
    annotations:
      readOnlyHint: true
  - name: get_commit
    description: Get one commit with its changed files. Returns a structured result; errors include a message and the offending
      field.
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
        sha:
          type: string
          description: The sha to use for this operation.
      required:
      - owner
      - repo
      - sha
    annotations:
      readOnlyHint: true
  - name: list_branches
    description: List branches in a repository. Returns a structured result; errors include a message and the offending field.
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
      required:
      - owner
      - repo
    annotations:
      readOnlyHint: true
  - name: create_branch
    description: Create a branch from another branch or commit. Returns a structured result; errors include a message and
      the offending field.
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
        branch:
          type: string
          description: The branch to use for this operation.
        from_branch:
          type: string
          description: The from branch to use for this operation.
      required:
      - owner
      - repo
      - branch
    annotations:
      readOnlyHint: false
  - name: get_file_contents
    description: Read a file or list a directory in a repository at a ref. Returns a structured result; errors include a message
      and the offending field.
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
        path:
          type: string
          description: Path to the file or directory, relative to the root the server exposes.
        ref:
          type: string
          description: The ref to use for this operation.
      required:
      - owner
      - repo
      - path
    annotations:
      readOnlyHint: true
  - name: create_or_update_file
    description: Create or update one file in a repository with a commit. Returns a structured result; errors include a message
      and the offending field.
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
        path:
          type: string
          description: Path to the file or directory, relative to the root the server exposes.
        content:
          type: string
          description: The full new content to write, as UTF-8 text.
        message:
          type: string
          description: The message to use for this operation.
        branch:
          type: string
          description: The branch to use for this operation.
      required:
      - owner
      - repo
      - path
      - content
      - message
    annotations:
      readOnlyHint: false
  - name: delete_file
    description: Delete a file from a repository with a commit. Returns a structured result; errors include a message and
      the offending field.
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
        path:
          type: string
          description: Path to the file or directory, relative to the root the server exposes.
        message:
          type: string
          description: The message to use for this operation.
      required:
      - owner
      - repo
      - path
      - message
    annotations:
      readOnlyHint: false
      destructiveHint: true
  - name: search_code
    description: Search code across GitHub repositories. Returns a structured result; errors include a message and the offending
      field.
    inputSchema:
      type: object
      properties:
        query:
          type: string
          description: Search text. Supports the service's search qualifiers and boolean operators.
      required:
      - query
    annotations:
      readOnlyHint: true
  - name: list_workflow_runs
    description: List GitHub Actions workflow runs and their status. Returns a structured result; errors include a message
      and the offending field.
    inputSchema:
      type: object
      properties:
        owner:
          type: string
          description: 'Repository owner: the user or organization name, for example ''octocat''.'
        repo:
          type: string
          description: Repository name without the owner, for example 'hello-world'.
        workflow_id:
          type: string
          description: The workflow id to use for this operation.
        branch:
          type: string
          description: The branch to use for this operation.
      required:
      - owner
      - repo
    annotations:
      readOnlyHint: true
  - name: get_workflow_run_logs
    description: Download the logs of a workflow run. Returns a structured result; errors include a message and the offending
