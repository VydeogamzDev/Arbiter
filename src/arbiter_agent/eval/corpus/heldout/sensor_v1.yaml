    - "Keep the output format the same."
    - "Whatever you do, don't touch the billing code."
    - "The page should load in under a second."
    - "We need this to work on Python 3.9 as well."
    - "Please make sure the existing tests still pass."
    - "No new dependencies, if you can help it."
    - "Users should be able to undo the deletion."
    - "Error messages need to be translated too."
    - "It has to handle files bigger than 2 GB."
    - "Make sure nothing gets logged with the user's password."
    - "The migration must be reversible."
    - "I'd like the config to live in a single file."
    - "Mobile users shouldn't see the admin link."
    - "Don't change the database schema."
    - "The CLI flags should stay backwards compatible."
    - "Add a test for the empty-input case."
    - "It must not call the network during tests."
    - "The export should include the timestamp column."
    - "Remember to update the docs."
    - "Only admins should be able to see this page."
    - "The job should be safe to run twice."
    - "Please keep the commit history clean."
    - "The response needs a Cache-Control header."
    - "Everything should work offline."
  not_requirements:
    - "I tried this last week and it didn't work."
    - "Our team is five people."
    - "The old version was written in 2019."
    - "Thanks, that was helpful."
    - "I'm not sure why it's slow."
    - "Here's the stack trace."
    - "We use Postgres in production."
    - "That's a good question."
    - "The bug was reported by a customer yesterday."
    - "I think the issue is in the parser."
    - "Our CI runs on GitHub Actions."
    - "Hmm, interesting."
    - "Let me know what you find."
    - "I'll be back in an hour."
    - "The file is in the src folder."
    - "This used to work before the upgrade."
    - "My manager asked about this."
    - "What does this function do?"
    - "The logs are pretty noisy."
    - "We had a similar problem in another project."
    - "I'm on a Mac."
    - "Good morning!"
    - "Sorry, I pasted the wrong file."
    - "It's a Django app."
    - "The deadline is Friday."
