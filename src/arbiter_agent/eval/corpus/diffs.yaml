# Diff-risk corpus (M9.3 exit: dangerous misses <= 1% of tasks). Each case is one task's diff with
# the minimum review level a careful reviewer would require. A dangerous miss is a case labeled
# high/critical that the analysis rates below high. Over-flagging (labeled low, rated high+) is
# reported but isn't a gate. Written by the assistant that wrote the classifier; extend it with
# real diffs whenever possible.
version: 1
cases:
  - id: auth-check-removed
    min_level: critical
    files:
      - {path: app/auth/views.py, removed: ["    if not user.check_password(password):", "        raise PermissionDenied()"], added: ["    pass"]}
  - id: drop-table-migration
    min_level: critical
    files:
      - {path: migrations/0042_cleanup.py, status: A, added: ["    op.drop_table('invoices')"]}
