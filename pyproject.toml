[project]
name = "arbiter-agent"
version = "0.1.0"
description = "Arbiter: a local control plane that audits, verifies and advises AI coding agents (Codex, Claude Code, and more)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
encoder = ["gliner2[local]>=2.0,<3", "onnxruntime>=1.20"]   # tier 0 sensor (GLiNER2.5-Decide); pulls PyTorch
encoder-export = ["arbiter-agent[encoder]", "onnx>=1.17", "onnxscript>=0.2"]   # arbiter semif export-onnx
encoder-coreml = ["arbiter-agent[encoder]", "coremltools>=8.0; sys_platform == 'darwin'"]   # macOS tier 0

[project.scripts]
arbiter = "arbiter_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arbiter_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: longer-running integration tests (daemon subprocesses, latency gates)",
    "windows: Windows-only behaviour",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "."]
extend-exclude = ["src/arbiter_agent/eval/corpus", "bench/tasks"]   # fixture repos are data, not Arbiter code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = [
    "S101",   # assert in tests
    "S603",   # subprocess without shell is intentional
    "S607",   # partial executable paths (powershell, git) are intentional
    "RUF012",
    "RUF005",  # list concatenation is clearer for argv building
    "S110",    # try/except/pass is deliberate on fail-open paths (hooks must never break the host)
    "S608",    # SQL is assembled only from constant fragments; values are always bound parameters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"bench/make_tasks.py" = ["S", "E501"]   # embedded fixture sources
"bench/**" = ["S"]        # benchmark harness: local subprocesses, junit xml it wrote itself, seeded bootstrap

[tool.mypy]
python_version = "3.11"
files = ["src/arbiter_agent"]
exclude = ["src/arbiter_agent/eval/corpus/"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# optional sensor stack ([encoder] extra): untyped for our purposes, and never type-checked here
module = ["gliner2", "gliner2.*", "torch", "torch.*", "transformers", "transformers.*", "numpy", "numpy.*",
          "peft", "peft.*", "safetensors", "safetensors.*", "onnx", "onnx.*", "onnxruntime", "onnxruntime.*",
          "coremltools", "coremltools.*", "psutil", "psutil.*", "ml_dtypes", "ml_dtypes.*", "onnx_ir", "onnx_ir.*",
          "onnxscript", "onnxscript.*", "tokenizers", "tokenizers.*", "huggingface_hub", "huggingface_hub.*"]
follow_imports = "skip"
follow_untyped_imports = false
follow_imports_for_stubs = true
